services:

  # ── PostgreSQL для Evolution API ──────────────────────────────────────────────
  cc_evo_postgres:
    image: postgres:16-alpine
    container_name: cc_evo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass
    volumes:
      - evo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  cc_redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Evolution API ─────────────────────────────────────────────────────────────
  cc_evolution:
    image: evoapicloud/evolution-api:latest
    container_name: cc_evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - SERVER_URL=http://188.241.217.76:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=429683C4C977415CAAFCCE10F7D57E11
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass@cc_evo_postgres:5432/evolution_db
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=false
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - WEBHOOK_GLOBAL_URL=http://cc_backend:3001/api/webhook/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=true
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      cc_evo_postgres:
        condition: service_healthy

  # ── Backend (NestJS) ──────────────────────────────────────────────────────────
  cc_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cc_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - ./backend/.env.production
    depends_on:
      cc_redis:
        condition: service_healthy
      cc_evo_postgres:
        condition: service_healthy
    volumes:
      - backend_reports:/app/reports

  # ── Admin Panel ───────────────────────────────────────────────────────────────
  cc_admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: cc_admin
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - cc_backend

  # ── Operator Panel ────────────────────────────────────────────────────────────
  cc_operator:
    build:
      context: ./apps/operator
      dockerfile: Dockerfile
    container_name: cc_operator
    restart: unless-stopped
    ports:
      - '3002:80'
    depends_on:
      - cc_backend

volumes:
  evo_postgres_data:
  redis_data:
  evolution_data:
  backend_reports:
