version: "3.9"

# ─── Call-Center Stack ────────────────────────────────────────────────────────
#
# БД: Neon PostgreSQL (внешний, не нужен локальный postgres контейнер)
# Services:
#   evolution-api   — Evolution API (WhatsApp Baileys, порт 8080)
#   backend         — Наш Express (порт 3001)
#
# Запуск:
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Evolution API ────────────────────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: callcenter_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL:   "http://188.241.217.76:8080"
      SERVER_PORT:  "8080"
      CORS_ORIGIN:  "*"
      CORS_CREDENTIALS: "true"

      # Auth
      AUTHENTICATION_API_KEY: "429683C4C977415CAAFCCE10F7D57E11"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Database — Neon PostgreSQL, отдельная schema evolution_api
      DATABASE_PROVIDER:             postgresql
      DATABASE_CONNECTION_URI:       "postgresql://neondb_owner:npg_MmQw8rHFN9OU@ep-withered-pond-aythlva6-pooler.c-5.us-east-2.aws.neon.tech/neondb?schema=evolution_api&sslmode=require&channel_binding=require"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE:   "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE:  "true"
      DATABASE_SAVE_DATA_CONTACTS:   "true"
      DATABASE_SAVE_DATA_CHATS:      "true"
      DATABASE_SAVE_DATA_HISTORIC:   "true"
      DATABASE_DELETE_MESSAGE:       "true"

      # Redis — отключено (без Redis проще для старта)
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # QR
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"

      # Webhook (глобальный выключен — наш backend ставит per-instance)
      WEBHOOK_GLOBAL_ENABLED: "false"

      LOG_LEVEL:   "ERROR,WARN,INFO"
      LOG_BAILEYS: "error"

      LANGUAGE: "en"

    volumes:
      - evolution_data:/evolution/instances
    networks:
      - callcenter

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callcenter_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # Evolution API достижим через Docker network
      EVOLUTION_API_URL: "http://evolution-api:8080"
      # Webhook — evolution-api контейнер постит сюда (через host network)
      WEBHOOK_URL: "http://172.16.0.2:3001/webhook/evolution"
      NODE_ENV: production
    volumes:
      - backend_reports:/app/reports
      - backend_logs:/app/logs
    depends_on:
      - evolution-api
    # Use db push instead of migrate deploy (no migrations folder needed)
    command: >
      sh -c "
        npx prisma db push --schema=prisma/schema.prisma --accept-data-loss &&
        node dist/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - callcenter

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  evolution_data:
  backend_reports:
  backend_logs:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  callcenter:
    driver: bridge
