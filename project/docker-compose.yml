version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: callcenter
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: callcenter123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callcenter']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Evolution API v2.x — with proper webhook config ──────────────────────────
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: cc_evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - SERVER_URL=http://188.241.217.76:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=429683C4C977415CAAFCCE10F7D57E11
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass@cc_evo_postgres:5432/evolution_db
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://cc_redis:6379
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      # Webhook events
      - WEBHOOK_GLOBAL_URL=http://cc_backend:3001/api/webhook/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=true
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      - cc_evo_postgres
      - cc_redis

  # ── Separate PostgreSQL for Evolution ─────────────────────────────────────────
  cc_evo_postgres:
    image: postgres:16-alpine
    container_name: cc_evo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_db
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass
    volumes:
      - evo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cc_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_reports:/app/reports

  # ── Admin Panel ───────────────────────────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: cc_admin
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

  # ── Operator Panel ────────────────────────────────────────────────────────────
  operator:
    build:
      context: ./apps/operator
      dockerfile: Dockerfile
    container_name: cc_operator
    restart: unless-stopped
    ports:
      - '3002:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  evolution_data:
  evo_postgres_data:
  backend_reports:
