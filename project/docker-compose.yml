version: "3.9"

# ─── Call-Center Stack ────────────────────────────────────────────────────────
#
# БД:
#   - Backend       → Neon PostgreSQL (external, schema=callcenter)
#   - Evolution API → local PostgreSQL (advisory locks + DDL migrations)
#
# Services:
#   postgres        — PostgreSQL 16 for Evolution API
#   evolution-api   — WhatsApp Baileys API (port 8080)
#   backend         — Our Express + Socket.IO (port 3001)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — только для Evolution API ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: callcenter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     evolution
      POSTGRES_PASSWORD: evolution_pass
      POSTGRES_DB:       evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - callcenter

  # ── Evolution API ─────────────────────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: callcenter_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL:   "http://188.241.217.76:8080"
      SERVER_PORT:  "8080"
      CORS_ORIGIN:  "*"
      CORS_CREDENTIALS: "true"

      AUTHENTICATION_API_KEY: "429683C4C977415CAAFCCE10F7D57E11"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Local postgres — supports advisory locks needed by Prisma migrate
      DATABASE_PROVIDER:             postgresql
      DATABASE_CONNECTION_URI:       "postgresql://evolution:evolution_pass@postgres:5432/evolution_db?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE:   "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE:  "true"
      DATABASE_SAVE_DATA_CONTACTS:   "true"
      DATABASE_SAVE_DATA_CHATS:      "true"
      DATABASE_SAVE_DATA_HISTORIC:   "true"
      DATABASE_DELETE_MESSAGE:       "true"

      CACHE_REDIS_ENABLED:  "false"
      CACHE_LOCAL_ENABLED:  "true"
      QRCODE_LIMIT:         "30"
      DEL_INSTANCE:         "false"
      WEBHOOK_GLOBAL_ENABLED: "false"

      LOG_LEVEL:   "ERROR,WARN,INFO"
      LOG_BAILEYS: "error"
      LANGUAGE:    "en"

    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - callcenter

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callcenter_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # Neon PostgreSQL with dedicated schema for our backend
      DATABASE_URL: "postgresql://neondb_owner:npg_MmQw8rHFN9OU@ep-withered-pond-aythlva6-pooler.c-5.us-east-2.aws.neon.tech/neondb?schema=callcenter&sslmode=require&channel_binding=require"
      # Evolution API reachable by service name inside Docker network
      EVOLUTION_API_URL: "http://evolution-api:8080"
      # Webhook — Evolution API posts here (same Docker network)
      WEBHOOK_URL: "http://backend:3001/webhook/evolution"
      NODE_ENV: production
    volumes:
      - backend_reports:/app/reports
      - backend_logs:/app/logs
    depends_on:
      - evolution-api
    command: >
      sh -c "
        npx prisma db push --schema=prisma/schema.prisma --accept-data-loss --skip-generate 2>&1 | grep -E '(sync|error|Error)' || true &&
        node dist/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - callcenter

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  evolution_data:
  backend_reports:
  backend_logs:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  callcenter:
    driver: bridge
