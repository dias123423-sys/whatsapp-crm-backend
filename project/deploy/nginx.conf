# /etc/nginx/sites-available/callcenter
# VPS: 188.241.217.76

upstream backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream evolution {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── Admin Panel ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.yourdomain.com 188.241.217.76;

    client_max_body_size 20M;

    # Admin SPA
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Webhook (Evolution API → Backend)
    location /webhook/ {
        proxy_pass         http://backend/api/webhook/;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass             http://backend/socket.io/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
        proxy_buffering        off;
    }

    location /health {
        proxy_pass http://backend/api/health;
    }

    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
}

# ── Operator Panel ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name operator.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass             http://backend/socket.io/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
    }
}

# ── Evolution API ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name evo.yourdomain.com;

    location / {
        proxy_pass         http://evolution/;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
