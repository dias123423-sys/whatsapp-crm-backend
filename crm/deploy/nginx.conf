upstream backend  { server 127.0.0.1:4000; keepalive 64; }
upstream frontend { server 127.0.0.1:3000; keepalive 32; }
upstream evolution { server 127.0.0.1:8080; keepalive 16; }

server {
    listen 80;
    server_name 188.241.217.76;
    client_max_body_size 10M;

    # Frontend (CRM dashboard)
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Backend REST API
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 60s;
    }

    # Webhook (no auth)
    location /webhook/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
        proxy_buffering    off;
    }

    # Health
    location /health {
        proxy_pass http://backend;
    }

    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
}
