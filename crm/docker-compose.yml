version: "3.9"
# ─── WhatsApp Lead CRM Stack ──────────────────────────────────────────────────
# Services:
#   redis          — cache / queue / sessions
#   evolution-api  — WhatsApp Baileys (port 8080)
#   backend        — NestJS API (port 4000)
#   frontend       — Next.js dashboard (port 3000)

services:

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: crm_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL:   "http://188.241.217.76:8080"
      SERVER_PORT:  "8080"
      CORS_ORIGIN:  "*"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-429683C4C977415CAAFCCE10F7D57E11}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "${DATABASE_URL_EVOLUTION}"
      DATABASE_CONNECTION_CLIENT_NAME: crm_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/1"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_BAILEYS: "error"
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      EVOLUTION_API_URL: "http://evolution-api:8080"
      WEBHOOK_URL: "http://backend:4000/webhook/evolution"
      NODE_ENV: production
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --schema=prisma/schema.prisma --accept-data-loss --skip-generate 2>&1 | grep -E '(sync|Error)' || true && node dist/main"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - crm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://188.241.217.76:4000"
        NEXT_PUBLIC_SOCKET_URL: "http://188.241.217.76:4000"
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - crm

volumes:
  redis_data:
  evolution_data:
  backend_logs:

networks:
  crm:
    driver: bridge
